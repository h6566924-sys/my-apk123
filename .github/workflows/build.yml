name: Build APK V10
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.3'
    - name: Build
      run: |
        echo "Building MyApp"
        if [ -f pubspec.yaml ]; then flutter pub get; flutter build apk --debug || true; fi
        if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug || true; fi
        if [ -f build.gradle ] || [ -f build.gradle.kts ]; then gradle assembleDebug || true; fi
        if [ -f package.json ]; then npm install || true; if [ -d android ]; then cd android; chmod +x gradlew; ./gradlew assembleDebug || true; cd ..; fi; fi
        if [ -f index.html ] && [ ! -f build.gradle ]; then npm init -y || true; npm install @capacitor/core @capacitor/cli @capacitor/android || true; npx cap init "MyApp" com.example.myapp --web-dir=. || true; npx cap add android || true; npx cap copy || true; cd android; chmod +x gradlew; ./gradlew assembleDebug || true; fi
        find . -name "*.apk" -type f
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: |
          **/*.apk
